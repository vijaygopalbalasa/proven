name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the board and verify read the git history of the receipts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (a fake Kane: no login, no secrets, no network)
        run: npm test
      - name: The judge board answers
        run: |
          npm start > board.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/ || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          kill $pid || true
          cat board.log
          [ "$ok" = "1" ]
