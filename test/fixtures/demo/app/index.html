<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your cart | Corner Roast</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">Corner Roast</a>
    <span class="tagline">Small-batch coffee, roasted on Tuesdays</span>
  </header>

  <main class="cart">
    <h1>Your cart</h1>

    <table class="items">
      <thead>
        <tr><th scope="col">Item</th><th scope="col">Price</th><th scope="col">Quantity</th><th scope="col">Line total</th></tr>
      </thead>
      <tbody id="items"></tbody>
    </table>

    <form id="coupon-form" class="coupon">
      <label for="coupon">Coupon</label>
      <input id="coupon" name="coupon" type="text" autocomplete="off" spellcheck="false">
      <button type="submit">Apply</button>
      <p id="coupon-message" class="message" role="status"></p>
    </form>

    <dl class="totals">
      <dt>Subtotal</dt><dd id="subtotal"></dd>
      <dt>Discount</dt><dd id="discount"></dd>
      <dt>Shipping</dt><dd id="shipping"></dd>
      <dt class="grand">Order total</dt><dd id="total" class="grand"></dd>
    </dl>

    <p class="note">Free shipping on orders of $50.00 or more.</p>
  </main>

  <script src="cart.js"></script>
</body>
</html>
